spring.application.name=territory-predictive-insights-fev

# Console limpo: sem o banner do Spring e só avisos importantes no log
spring.main.banner-mode=off
logging.level.root=WARN

# Banco H2 gravado em arquivo (pasta ./dados): o histórico sobrevive ao reiniciar o programa
spring.datasource.url=jdbc:h2:file:./dados/territorio
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate: cria as tabelas automaticamente se não existirem
spring.jpa.hibernate.ddl-auto=update
# SQL desligado no console para não atrapalhar o menu (troque para true para depurar)
spring.jpa.show-sql=false
